<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nofluff</title>
    <meta
      name="description"
      content="Turn product pages into concise client-ready emails in English or Czech."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <span class="brand-mark">nofluff</span>
        <span class="header-tagline">Turn product pages into client-ready emails</span>
        <span id="healthBadge" class="badge">Checking AI status...</span>
        <nav class="micro-nav">
          <a href="https://github.com/danielavokalova/nofluff">GitHub</a>
        </nav>
      </header>

      <main id="workspace" class="layout">
        <section class="panel">
          <div class="panel-heading">
            <h2>Source</h2>
          </div>

          <label class="field">
            <span>Source URL</span>
            <input id="sourceUrl" type="url" placeholder="https://www.example.com/product-page" />
          </label>

          <div class="button-row wrap">
            <button id="fetchBtn" class="button primary">Fetch URL</button>
            <button id="loadDemoBtn" class="button secondary">Load demo</button>
            <button id="clearSourceBtn" class="button ghost">Clear</button>
          </div>

          <label class="field">
            <span>Upload file</span>
            <input
              id="sourceFile"
              type="file"
              accept=".txt,.md,.html,.htm,.csv,.json,.xml,.pdf,.docx,.png,.jpg,.jpeg,.webp,.gif,.bmp"
            />
          </label>

          <label class="field">
            <span>Product / page title</span>
            <input id="sourceTitle" type="text" placeholder="Page title or product name" />
          </label>

          <label class="field">
            <span>Extra instructions</span>
            <textarea
              id="extraInstructions"
              rows="3"
              placeholder="Optional: focus on pricing, version differences, client value, implementation scope, or target audience."
            ></textarea>
          </label>

          <label class="field">
            <span>Source text</span>
            <textarea
              id="sourceText"
              rows="20"
              placeholder="Paste source text here, or use Fetch URL / Upload file above."
            ></textarea>
          </label>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Output</h2>
          </div>

          <div class="inline-grid">
            <label class="field">
              <span>Output type</span>
              <select id="outputPurpose">
                <option value="email">Client email</option>
                <option value="summary">Short summary</option>
              </select>
            </label>

            <label class="field">
              <span>Language</span>
              <select id="languageMode">
                <option value="en">English</option>
                <option value="cs">Czech</option>
              </select>
            </label>

            <label class="field">
              <span>Format</span>
              <select id="outputMode">
                <option value="plain">Plain text</option>
                <option value="markdown">Markdown</option>
                <option value="html">HTML</option>
              </select>
            </label>

            <label class="field">
              <span>OpenAI API key</span>
              <input
                id="apiKey"
                type="password"
                placeholder="sk-… (browser only, not stored)"
                autocomplete="off"
              />
            </label>
          </div>

          <div class="button-row wrap">
            <button id="generateBtn" class="button primary">Generate</button>
            <button id="clearBtn" class="button ghost">Clear output</button>
          </div>

          <label class="field">
            <span>Generated output</span>
            <textarea id="resultText" rows="24" placeholder="Output will appear here after you click Generate."></textarea>
          </label>

          <div class="button-row wrap">
            <button id="copyBtn" class="button secondary">Copy</button>
            <button id="copySubjectBtn" class="button secondary">Copy subject</button>
            <button id="downloadTxtBtn" class="button secondary">TXT</button>
            <button id="downloadMdBtn" class="button secondary">MD</button>
            <button id="downloadHtmlBtn" class="button secondary">HTML</button>
            <button id="mailtoBtn" class="button ghost">Open mail draft</button>
          </div>
        </section>
      </main>

      <section class="panel status-panel">
        <p id="statusMessage">Ready.</p>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
